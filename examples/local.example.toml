# Offline config validation only. The placeholder agent must remain unavailable.
# Real dispatch requires a configured Brigade CLI and an admitted logical seat.
schema = "t3-fleet.config.v1"
controller_host = "controller-a"
coordination_mode = "single-controller"
global_active_limit = 1

[hosts.controller-a]
enabled = true
platform = "linux"
transport = "local"
agent_command = ["/opt/t3-fleet/example-unconfigured-agent"]
active_limit = 1
expected_hostname = "controller-a"

[repositories.example-repo]
default_branch = "main"
branch_prefix = "codex/"

[repositories.example-repo.paths]
controller-a = "/srv/repos/example"

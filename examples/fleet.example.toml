schema = "t3-fleet.config.v1"
controller_host = "controller-a"
controller_id = "controller-a"
coordination_mode = "target-authoritative"
global_active_limit = 3

[hosts.controller-a]
enabled = true
platform = "linux"
transport = "local"
agent_command = ["/home/operator/.local/bin/t3-fleet-agent"]
active_limit = 1
expected_hostname = "controller-a"
# Optional. Per-repository cap on this host. 0 or unset uses active_limit.
# Each request runs in an isolated worktree. Set 1 for one request per repository.
# max_concurrent_per_repository = 0
# Optional. Seconds a stuck request may hold a repository slot (default 21600).
# repository_lease_ttl_seconds = 21600

[hosts.target-a]
enabled = true
platform = "linux"
transport = "ssh"
ssh_alias = "target-a"
agent_command = ["/home/operator/.local/bin/t3-fleet-agent"]
active_limit = 1
expected_hostname = "target-a"

[hosts.target-b]
enabled = true
platform = "linux"
transport = "ssh"
ssh_alias = "target-b"
agent_command = ["/home/operator/.local/bin/t3-fleet-agent"]
active_limit = 1
expected_hostname = "target-b"

[repositories.example-repo]
default_branch = "main"
branch_prefix = "codex/"

[repositories.example-repo.paths]
controller-a = "/srv/repos/example"
target-a = "/srv/repos/example"
target-b = "/srv/repos/example"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install .

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

  test-windows:
    name: Test Windows launcher (Python 3.13)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install .

      - name: Run Windows launcher contract
        shell: pwsh
        run: |
          scripts/test-windows-launcher.ps1 `
            -Launcher scripts/t3-fleet-agent.ps1 `
            -PythonExecutable (Get-Command python).Source

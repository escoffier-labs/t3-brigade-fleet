name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install .

      - name: Generate public skill projections
        run: python scripts/project-skill.py

      - name: Run unit tests
        env:
          PYTHONPATH: tests
        run: python -m unittest discover -s tests -v

      - name: Check public skill projections
        run: python scripts/project-skill.py --check

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/t3-wheel"
          "$RUNNER_TEMP/t3-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/t3-wheel/bin/python" -I -m t3_fleet --help
          "$RUNNER_TEMP/t3-wheel/bin/python" -I -c 'import t3_fleet.agent, t3_fleet.cli, t3_fleet.policy, t3_fleet.outbox, t3_fleet.reporting, t3_fleet.t3_rpc, t3_fleet.timer'

  test-windows:
    name: Test Windows launcher (Python 3.13)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install .

      - name: Run Windows launcher contract
        shell: pwsh
        run: |
          scripts/test-windows-launcher.ps1 `
            -Launcher scripts/t3-fleet-agent.ps1 `
            -PythonExecutable (Get-Command python).Source

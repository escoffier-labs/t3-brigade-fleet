[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t3-fleet"
version = "0.1.0"
description = "Dispatch and manage T3 Code sessions across an allowlisted fleet"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
t3-fleet = "t3_fleet.cli:main"
t3-fleet-agent = "t3_fleet.agent:main"

[tool.setuptools.packages.find]
where = ["src"]
